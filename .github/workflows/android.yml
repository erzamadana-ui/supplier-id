name: Android APK/AAB (Supplier-ID pelanggan)
# Android SDK tidak tersedia di lingkungan pengembangan Claude (dl.google.com diblokir) → build di runner GitHub (sudah berisi SDK).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', 'web/**', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          # paket default action memuat 'tools' (sudah dihapus Google) → sdkmanager exit 1; sebutkan paket eksplisit
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Build web assets untuk APK (base '/', API absolut)
        working-directory: web
        run: |
          npm ci
          VITE_BASE=/ VITE_API_URL=https://supplier-api.antarkitaindonesia.com npx vite build --outDir ../android-app/www --emptyOutDir
      - name: Capacitor sync
        working-directory: android-app
        run: |
          npm ci
          npx cap sync android
      - name: Gradle assembleDebug + bundleRelease (unsigned)
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: supplier-id-app-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: supplier-id-app-release-aab-unsigned
          path: android-app/android/app/build/outputs/bundle/release/app-release.aab

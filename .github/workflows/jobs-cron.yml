name: Jobs cron (konfirmasi 24 jam, pembayaran kedaluwarsa, task terlambat, inquiry payout)
# Vercel Hobby tidak menjalankan proses latar; scheduler eksternal memanggil endpoint job yang idempotent & durable (state di DB).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil /api/jobs/run
        run: |
          curl -sS -f -X POST "https://supplier-api.antarkitaindonesia.com/api/jobs/run" -H "x-job-secret: ${{ secrets.JOB_SECRET }}" -H "content-length: 0"
